name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish dry run
        run: |
          # Newer Flutter versions may rewrite analysis_options.yaml (adding an
          # `analyzer: exclude:` block) or refresh example/pubspec.lock during
          # pub get / analyze. Restore the committed tree so the publish
          # git-clean check is deterministic across Flutter versions.
          git checkout -- .
          flutter pub publish --dry-run
